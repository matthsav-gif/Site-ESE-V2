<style>
/* Plein écran : la maquette occupe tout, l'interface flotte en marge (marque en haut, calques à droite, vues en bas). Look nuit unique, charte ESE V3. */
:root{
  --nuit:#0B0B0C; --carte:rgba(21,21,23,.86); --ligne:rgba(243,242,238,.14);
  --papier:#F3F2EE; --gris:#A3A39D; --bleu:#1C45F2; --bleu-clair:#4F6DFF; --vert:#2BB673; --orange:#E8A23A;
  --f-titre:'Archivo',Arial,sans-serif; --f-texte:'Archivo',Arial,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--nuit);color:var(--papier);font-family:var(--f-texte);overflow:hidden;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;display:block;touch-action:none;outline:none}
.ui{position:fixed;z-index:5}
.panneau{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
/* marque */
#marque{top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;padding:10px 14px 10px 12px}
#marque img{width:30px;height:30px}
#marque h1{margin:0;font:850 20px/1 var(--f-titre);font-variation-settings:'wdth' 72;letter-spacing:-.02em;text-transform:uppercase}
#marque h1 i{display:inline-block;width:.24em;height:.24em;border-radius:50%;background:var(--bleu-clair);margin-left:.06em;vertical-align:baseline}
#marque .mono{margin-top:4px;font-size:10px}
/* calques */
#calques{top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));padding:12px 14px;display:grid;gap:9px;min-width:190px}
#calques label{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}
#calques input{accent-color:var(--bleu-clair);width:16px;height:16px;margin:0}
.puce{width:10px;height:10px;border-radius:2px;flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ligne);border-radius:8px;overflow:hidden;margin-top:2px}
.seg button{all:unset;text-align:center;padding:7px 0;font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gris);cursor:pointer}
.seg button.on{background:var(--bleu);color:#fff}
.seg button:focus-visible,.vue:focus-visible,.btn:focus-visible{outline:2px solid var(--bleu-clair);outline-offset:2px}
#bascule{display:none}
/* chiffres */
#chiffres{left:max(16px,env(safe-area-inset-left,0px));top:calc(84px + env(safe-area-inset-top,0px));padding:12px 14px;display:grid;gap:8px;width:220px}
#chiffres .l{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--gris)}
#chiffres .l b{color:var(--papier);font:600 13px var(--f-mono);font-variant-numeric:tabular-nums}
#chiffres .jauge{font:850 34px/1 var(--f-titre);font-variation-settings:'wdth' 72;letter-spacing:-.02em}
#chiffres .jauge small{font:500 11px var(--f-mono);letter-spacing:.12em;color:var(--gris);display:block;margin-top:4px;text-transform:uppercase}
/* vues */
#bas{left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;justify-items:center;pointer-events:none}
#actions{display:flex;gap:8px;pointer-events:auto}
.btn{all:unset;cursor:pointer;padding:9px 14px;border-radius:999px;font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;background:var(--bleu);color:#fff;box-shadow:0 6px 24px rgba(28,69,242,.35)}
.btn.sec{background:var(--carte);border:1px solid var(--ligne);box-shadow:none;color:var(--papier)}
#vues{pointer-events:auto;display:flex;gap:6px;padding:8px;max-width:100%;overflow-x:auto;scrollbar-width:none}
#vues::-webkit-scrollbar{display:none}
.vue{all:unset;flex:none;cursor:pointer;padding:9px 12px;border-radius:8px;display:grid;gap:3px;min-width:96px}
.vue .mono{font-size:10px}
.vue b{font:600 14px var(--f-texte);white-space:nowrap}
.vue.on{background:var(--bleu)} .vue.on .mono{color:rgba(255,255,255,.75)}
.vue:not(.on):hover{background:rgba(243,242,238,.07)}
.photo-ico{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:6px;vertical-align:middle}
/* étiquettes 3D */
#etiq{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.et{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:rgba(11,11,12,.78);color:var(--papier);border:1px solid var(--ligne)}
.et.zone{font:800 13px var(--f-titre);font-variation-settings:'wdth' 80;letter-spacing:.04em}
.et.issue{background:rgba(23,120,72,.92);border-color:rgba(255,255,255,.25);color:#fff}
.et.elec{color:#fff;border:0}
.et small{display:block;font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:none;opacity:.85;margin-top:2px}
/* rendu */
#rendu{position:fixed;inset:0;z-index:20;background:rgba(5,5,6,.94);display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#rendu header{display:flex;justify-content:space-between;align-items:center;gap:12px}
#rendu h2{margin:0;font:850 22px/1.1 var(--f-titre);font-variation-settings:'wdth' 72;text-transform:uppercase;letter-spacing:-.01em}
#rendu figure{margin:0;min-height:0;display:grid;place-items:center}
#rendu img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
#rendu footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#chargement{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:var(--nuit);font:500 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
#aide{left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));padding:8px 12px;font-size:12px;color:var(--gris)}
[hidden]{display:none!important}
#pied-ui{position:fixed;inset:0;z-index:4;pointer-events:none}
#manette{position:absolute;width:120px;height:120px;border-radius:50%;border:1px solid var(--ligne);background:rgba(21,21,23,.45);transform:translate(-50%,-50%)}
#manette i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(243,242,238,.75)}
#viseur{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(243,242,238,.55)}
.btn.petit{padding:7px 11px;font-size:11px}
#actions{flex-wrap:wrap;justify-content:center}
body.pied #chiffres,body.pied #vues{display:none}
body.pied #gl{cursor:grab}
@media (max-width:760px){
  #chiffres{display:none} #aide{display:none}
  #marque h1{font-size:16px} #marque img{width:24px;height:24px}
  #calques{min-width:0;padding:10px} #calques .corps{display:none} #calques.ouvert .corps{display:grid;gap:9px}
  #bascule{display:block;all:unset;cursor:pointer;font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
  .vue{min-width:84px;padding:8px 10px} .vue b{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<script>
(async function(){
// ---------- 1. Noyau : données, moteur, matières photo, ciel du soir, gros œuvre ----------
const $=s=>document.querySelector(s);
const fr=n=>Number(n).toLocaleString('fr-FR');
let D;
try{D=await (await fetch('data.json')).json();}catch(e){$('#chargement').textContent="La maquette n'a pas pu être chargée. Rechargez la page.";return;}
const etape=t=>{$('#chargement').textContent=t;};

$('#cj').firstChild.nodeValue=fr(D.jauge)+' ';
$('#ci').textContent=D.nb_issues+' · '+D.up+' UP';
$('#cf').textContent=fr(D.fosse)+' m²';
$('#cr').textContent=String(D.dist_regie).replace('.',',')+' m';
$('#sous').textContent='Parc des expositions du Breil · Saumur · plans '+D.indice;

const canvas=$('#gl');
const mobile=matchMedia('(max-width:760px)').matches||matchMedia('(pointer:coarse)').matches;
const r=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
r.setPixelRatio(Math.min(devicePixelRatio,mobile?1.5:2));
r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.0;
r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
const lin=c=>new THREE.Color(c).convertSRGBToLinear();
const s=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(42,1,0.1,2500);cam.up.set(0,0,1);
const ctl=new THREE.OrbitControls(cam,canvas);ctl.enableDamping=true;ctl.dampingFactor=0.08;ctl.maxPolarAngle=Math.PI*0.495;ctl.minDistance=1.5;ctl.maxDistance=420;ctl.screenSpacePanning=false;

// Lumière du soir : soleil bas à l'ouest, ciel en lumière d'ambiance.
const hemi=new THREE.HemisphereLight(0xdfe6ff,0x8a7a66,0.35);s.add(hemi);
const sun=new THREE.DirectionalLight(0xffd2a0,1.6);sun.position.set(-70,-30,38);sun.target.position.set(25,25,0);sun.castShadow=true;
sun.shadow.mapSize.set(mobile?2048:4096,mobile?2048:4096);Object.assign(sun.shadow.camera,{left:-75,right:75,top:60,bottom:-60,near:1,far:260});sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.03;s.add(sun);s.add(sun.target);

// Textures photo CC0 (Poly Haven), chargées avant la construction ; une texture absente laisse la matière unie.
const TL=new THREE.TextureLoader(),aniso=Math.min(8,r.capabilities.getMaxAnisotropy());
const charge=f=>new Promise(res=>TL.load('tex/'+f,t=>res(t),undefined,()=>res(null)));
etape('Chargement des matières…');
const TX={};
await Promise.all(['enrobe_d','enrobe_n','enrobe_r','beton_d','beton_n','bois_d','bois_n','galva_d'].map(async k=>{const t=await charge(k+'.jpg');if(t){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=aniso;if(k.endsWith('_d'))t.encoding=THREE.sRGBEncoding;}TX[k]=t;}));
// Toile PVC et grillage Heras : textures dessinées.
function texCanvas(w,h,dessin,srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;dessin(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=aniso;if(srgb)t.encoding=THREE.sRGBEncoding;return t;}
TX.grillage=texCanvas(128,128,(x,w,h)=>{x.clearRect(0,0,w,h);x.strokeStyle='#c9ccce';x.lineWidth=3;for(let i=0;i<=w;i+=32){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke();}x.lineWidth=4;for(let j=0;j<=h;j+=16){x.beginPath();x.moveTo(0,j);x.lineTo(w,j);x.stroke();}});
TX.grille=texCanvas(64,64,(x,w,h)=>{x.fillStyle='#141414';x.fillRect(0,0,w,h);x.fillStyle='#2c2c2c';for(let i=2;i<w;i+=6)for(let j=2;j<h;j+=6){x.beginPath();x.arc(i,j,1.6,0,7);x.fill();}});
TX.toile=texCanvas(256,256,(x,w,h)=>{x.fillStyle='#f4f3ee';x.fillRect(0,0,w,h);const im=x.getImageData(0,0,w,h),d=im.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*10;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}x.putImageData(im,0,0);x.strokeStyle='rgba(0,0,0,.06)';x.lineWidth=3;x.beginPath();x.moveTo(0,1);x.lineTo(w,1);x.stroke();});
TX.occult=texCanvas(64,64,(x,w,h)=>{x.fillStyle='#1f2a22';x.fillRect(0,0,w,h);x.fillStyle='rgba(255,255,255,.05)';for(let i=0;i<w;i+=4){x.fillRect(i,0,1,h);x.fillRect(0,i,w,1);}});

// Matières : couleur, rugosité, métal, texture, échelle de texture (m par motif), émission, transparence.
const MAT_DEF={
  enrobe:{c:'#8a8782',r:.95,map:'enrobe_d',nor:'enrobe_n',rough:'enrobe_r',sc:5},
  beton:{c:'#c9c6bf',r:.78,map:'beton_d',nor:'beton_n',sc:4},
  bois:{c:'#a07a55',r:.62,map:'bois_d',nor:'bois_n',sc:1.6},
  plancher:{c:'#9a7a58',r:.6,map:'bois_d',nor:'bois_n',sc:2.4},
  galva:{c:'#c3c6c8',r:.42,m:.85,map:'galva_d',sc:1.2},
  alu:{c:'#d4d6d8',r:.3,m:.9},
  acier:{c:'#8d9094',r:.38,m:.85},
  chrome:{c:'#e8e8e8',r:.12,m:1},
  noir:{c:'#1a1a1b',r:.6},
  noirbrillant:{c:'#0d0d0e',r:.25},
  grille:{c:'#ffffff',r:.7,map:'grille',sc:.12},
  blanc:{c:'#f1f0ec',r:.45},
  toile:{c:'#ffffff',r:.85,map:'toile',sc:3,side:2},
  toileint:{c:'#d8d6cf',r:.9,side:2},
  lest:{c:'#a8a7a1',r:.85},
  marche:{c:'#3a3936',r:.7},
  scene:{c:'#151516',r:.55},
  deck:{c:'#262522',r:.4},
  porte:{c:'#9a9a94',r:.5,m:.4},
  bati:{c:'#d0cfc8',r:.8},
  pneu:{c:'#141414',r:.9},
  vitre:{c:'#1c2630',r:.05,m:.2,op:.55},
  verre:{c:'#2f5a34',r:.1,m:.1},ambre:{c:'#8a4a12',r:.1,m:.1},clair:{c:'#cfd8d4',r:.05,m:.1},
  grillage:{c:'#ffffff',r:.4,m:.7,map:'grillage',sc:.4,alpha:true,side:2},
  occult:{c:'#ffffff',r:.95,map:'occult',sc:.5,side:2},
  tissu:{c:'#3b3a3f',r:.95},tissu2:{c:'#c9b79a',r:.95},
  plastbleu:{c:'#2a6fb0',r:.55},plastgris:{c:'#e3e3de',r:.55},
  rouge:{c:'#c8102e',r:.5},ese:{c:'#1C45F2',r:.45},
  carton:{c:'#b89466',r:.9},caisse:{c:'#2f5f3a',r:.7},fut:{c:'#cfd2d4',r:.25,m:.9},
  ledchaud:{c:'#2a1f12',r:.5,e:'#ffb066',ei:1.6},
  ecran:{c:'#05070a',r:.3,e:'#3d7bff',ei:1.2},
  frigo:{c:'#0e1418',r:.2,e:'#cfe6ff',ei:.7},
  interieur:{c:'#2a1c10',r:.8,e:'#ffcf8a',ei:.9},
  led:{c:'#0a0a0a',r:.4,e:'#FF2338',ei:2.2},
  vert:{c:'#3f6b3a',r:.9},terre:{c:'#4a4236',r:.95},
  murhall:{c:'#ffffff',r:.2,op:.14},murannexe:{c:'#ffffff',r:.2,op:.28},
};
const COUL=['#C8102E','#F2E9D8','#1D3557','#F4A261','#2A9D8F','#F1FAEE','#F2C14E','#222222','#111111','#E63946','#6a4c93','#ffffff'];
COUL.forEach(c=>MAT_DEF['c'+c]={c,r:.4,m:.1});
const MAT={},mats=[];
function mat(k){if(MAT[k])return MAT[k];const d=MAT_DEF[k]||{c:k.startsWith('#')?k:'#ff00ff',r:.7};
  const m=new THREE.MeshStandardMaterial({color:lin(d.c),roughness:d.r,metalness:d.m||0});
  if(d.map&&TX[d.map]){m.map=TX[d.map];}

    for(const m of MURS){const ax=m[0],ay=m[1],bx=m[2],by=m[3],vx=bx-ax,vy=by-ay,l2=vx*vx+vy*vy;let t=l2?((p.x-ax)*vx+(p.y-ay)*vy)/l2:0;t=Math.max(0,Math.min(1,t));
      const cx=ax+vx*t,cy=ay+vy*t,dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);if(d<RAYON&&d>1e-6){p.x=cx+dx/d*RAYON;p.y=cy+dy/d*RAYON;}}

  const i=D.vues.indexOf(courante);if(e.key==='ArrowRight'&&e.target===document.body)aller(D.vues[(i+1)%D.vues.length]);if(e.key==='ArrowLeft'&&e.target===document.body)aller(D.vues[(i-1+D.vues.length)%D.vues.length]);});

let rv=null;
function ouvrir(v,i){rv=v;const ph=v.ph[i];$('#r-titre').textContent=v.n;$('#r-img').src=ph.f;$('#r-img').alt=ph.t;$('#r-leg').textContent=ph.t+' · image générée à partir de la maquette';
  const n=$('#r-nav');n.innerHTML='';if(v.ph.length>1)v.ph.forEach((p,k)=>{const b=document.createElement('button');b.className='btn'+(k===i?'':' sec');b.textContent=String(k+1);b.style.marginLeft='6px';b.onclick=()=>ouvrir(v,k);n.appendChild(b);});
  $('#rendu').hidden=false;$('#r-fermer').focus();}
function fermer(){$('#rendu').hidden=true;canvas.focus();}
$('#r-fermer').onclick=fermer;

let FOVM=42;
function taille(){const w=innerWidth,h=innerHeight;FOVM=w<h?Math.min(70,42/(w/h)*.62):42;cam.fov=pied?70:FOVM;r.setSize(w,h,false);if(comp){comp.setSize(w,h);bloom.resolution.set(w,h);}canvas.style.width=w+'px';canvas.style.height=h+'px';cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',taille);taille();

const PV=new THREE.Vector3(),FW=new THREE.Vector3(),V2=new THREE.Vector3();let tPrec=0;
function boucle(t){requestAnimationFrame(boucle);const dt=Math.min(.05,(t-tPrec)/1000||0);tPrec=t;
  if(pied){cam.fov!==70&&(cam.fov=70,cam.updateProjectionMatrix());marche(dt);}
  else{if(cam.fov!==FOVM){cam.fov=FOVM;cam.updateProjectionMatrix();}
    if(anim){const k=Math.min(1,(t-anim.d)/1100),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;cam.position.lerpVectors(anim.p0,anim.p1,e);ctl.target.lerpVectors(anim.t0,anim.t1,e);if(k>=1)anim=null;}
    ctl.update();}
  ciel.position.copy(cam.position);majToit();
  anime(t/1000);if(soir&&comp)comp.render();else r.render(s,cam);
  const w=innerWidth,h=innerHeight;cam.getWorldDirection(FW);
  const prof=pied?1e9:V2.copy(ctl.target).sub(cam.position).dot(FW);
  for(const o of ETS){const on=calques[o.calque]&&!(pied&&o.calque==='zones');if(!on){o.e.style.display='none';continue;}
    const dz=V2.copy(o.v).sub(cam.position).dot(FW);
    if((dz>prof+6&&prof<60)||(pied&&(dz<1||dz>45))){o.e.style.display='none';continue;}
    PV.copy(o.v).project(cam);const vis=PV.z<1&&PV.z>-1&&Math.abs(PV.x)<1.1&&Math.abs(PV.y)<1.1;
    if(!vis){o.e.style.display='none';continue;}o.e.style.display='block';o.e.style.left=((PV.x+1)/2*w)+'px';o.e.style.top=((1-PV.y)/2*h)+'px';}}
const depart=D.vues.find(v=>'#'+v.k===location.hash)||D.vues[0];
aller(depart,true);requestAnimationFrame(boucle);
addEventListener('hashchange',()=>{const v=D.vues.find(v=>'#'+v.k===location.hash);if(v&&v!==courante)aller(v);});
$('#chargement').hidden=true;

})();
</script>
